<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Furniture plan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Outfit:wght@400;500;600&display=swap">
<style>
/* Layout: one screen. Slim header, layout chips, the plan fills the middle, a dock at the thumb. */
:root{
  color-scheme:dark;
  --bg:#1c1917; --panel:#262220; --panel-2:#342e2a; --line:#453d38;
  --fg:#f3ede2; --muted:#ada396;
  --accent:#a35a33; --gold:#b9953f;
  --paper:#f4f0e7; --paper-2:#e9dfd0; --ink:#1d1a18; --tile:#d5e0da;
  --wood:#8f4f2f; --wood-2:#a9735a; --green:#2f4a3f; --green-2:#263d34;
  --bad:#d8492f; --warn:#d99a1c; --ok:#7dbb8c;
  --display:"Lora","Iowan Old Style",Palatino,Georgia,serif;
  --body:"Outfit","Avenir Next","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.35 var(--body);
  display:flex;flex-direction:column;overflow:hidden;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.top{display:flex;align-items:flex-end;gap:8px;padding-block:10px 8px}
.top .ttl{flex:1;min-width:0}
.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--gold);font-weight:500}
h1{font:600 24px/1.1 var(--display);margin:2px 0 0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border-radius:50%;background:var(--panel);display:grid;place-items:center;flex:none}
.ib:disabled{opacity:.35}
.ib svg,.act svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.chips{display:flex;gap:8px;overflow-x:auto;padding-block:2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:40px;padding:0 16px;border-radius:20px;background:var(--panel);white-space:nowrap;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent)}
.chip.save{background:var(--gold);color:var(--ink)}

.stage{flex:1;min-height:0;position:relative;margin-inline:max(8px,env(safe-area-inset-left,0px)) max(8px,env(safe-area-inset-right,0px));
  background:var(--paper);border-radius:18px;overflow:hidden}
#plan{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;font-family:var(--body)}
.float{position:absolute;top:8px;display:flex;gap:6px}
.float.l{left:8px}.float.r{right:8px}
.fb{height:36px;min-width:36px;padding:0 13px;border-radius:18px;background:var(--ink);color:var(--paper);font-size:13px;font-weight:500}
.fb[aria-pressed="true"]{background:var(--accent)}

.dock{padding-block:10px max(10px,env(safe-area-inset-bottom,0px))}
.row{display:flex;gap:8px;align-items:center}
.info{flex:1;min-width:0}
.info b{font:600 18px/1.2 var(--display);display:block}
.info span{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.stat{font-size:14px;margin:6px 0 8px;display:flex;gap:8px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--ok)}
.dot.bad{background:var(--bad)}.dot.warn{background:var(--warn)}
.act{flex:1;height:48px;border-radius:14px;background:var(--panel);display:flex;gap:7px;align-items:center;justify-content:center;font-weight:500}
.act.del{flex:0 0 52px;color:#f0a08e}
.primary{flex:1;height:52px;border-radius:16px;background:var(--accent);font-weight:600;font-size:16px}
.sizes{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px;scrollbar-width:none}
.sizes .chip{height:36px;padding:0 14px;font-size:14px}

.scrim{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);width:100%;max-width:560px;max-height:82%;border-radius:22px 22px 0 0;display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet header{display:flex;align-items:center;padding-block:14px 8px}
.sheet h2{font:600 20px var(--display);margin:0;flex:1}
.sheet .body{overflow-y:auto;padding-block:0 18px}
.cat{font-size:11px;letter-spacing:.16em;color:var(--gold);margin:14px 0 8px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.card{background:var(--panel-2);border-radius:14px;padding:8px 8px 10px;text-align:left;min-width:0}
.card svg{width:100%;height:64px;display:block;background:var(--paper);border-radius:9px;margin-bottom:7px}
.card b{display:block;font-weight:500;font-size:14px}
.card span{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.custom{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.custom label{flex:1 1 80px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px;min-width:0}
input{font:inherit;color:var(--fg);background:var(--panel-2);border:1px solid var(--line);border-radius:12px;height:46px;padding:0 12px;width:100%;
  -webkit-user-select:text;user-select:text}
.custom .act{flex:1 1 100%;background:var(--accent)}
.saved{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.saved b{flex:1;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis}
.saved .chip{background:var(--panel-2)}
.note{color:var(--muted);font-size:13px;margin:10px 0 0}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>

<header class="top gut">
  <div class="ttl">
    <div class="eyebrow">TO SCALE · 1 SQUARE = 1 FT</div>
    <h1>Furniture plan</h1>
    <div class="sub" id="sub"></div>
  </div>
  <button class="ib" id="undo" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
  <button class="ib" id="redo" aria-label="Redo"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
  <button class="ib" id="reset" aria-label="Reset this layout"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
</header>
<nav class="chips gut" id="layouts" aria-label="Layouts"></nav>

<main class="stage">
  <svg id="plan" role="application" aria-label="Floor plan. Drag furniture to move it, pinch to zoom."></svg>
  <div class="float l" id="views">
    <button class="fb" data-view="all">All</button>
    <button class="fb" data-view="living">Living</button>
    <button class="fb" data-view="bed">Bed</button>
  </div>
  <div class="float r">
    <button class="fb" id="snap" aria-pressed="true">Snap</button>
    <button class="fb" id="grid" aria-pressed="true">Grid</button>
  </div>
</main>

<footer class="dock gut" id="dock"></footer>
<div class="scrim" id="scrim" hidden></div>

<script>
'use strict';
/* ---------- Floor plan, in inches. Scaled from the queen bed (60 x 80) in the original plan. ---------- */
const WALLS=[[0,0,106,0],[0,0,0,137],[0,137,59,137],[59,137,59,147],[59,183,59,316],[59,316,324,316],[324,60,324,316],
  [106,60,324,60],[106,0,106,60],[59,199,98,199],[98,199,98,244],[59,244,102,244],[132,244,177,244],[139,199,177,199],
  [139,199,139,244],[177,244,177,251],[177,283,177,316],[177,199,184,199],[216,199,324,199],[216,199,216,232]];
const THIN=[[177,201,177,244],[216,232,324,232],[294,199,294,232]];
const FIX=[{r:[4,4,102,26],n:'the kitchen counter'},{r:[4,26,26,94],n:'the kitchen counter'},{r:[4,96,36,134],n:'the fridge'},
  {r:[66,208,92,236],n:'the washer/dryer'},{r:[62,250,92,312],n:'the tub'},{r:[108,286,122,306],n:'the toilet'},{r:[132,290,174,313],n:'the vanity'}];
const DOORS=[{r:[59,147,95,183],n:'the entry door'},{r:[184,167,216,199],n:'the bedroom door'},{r:[184,201,216,225],n:'the bedroom door'},
  {r:[179,251,203,283],n:'the bathroom door'},{r:[102,216,132,244],n:'the bathroom door'}];
const ROOMS=[[0,0,106,137],[59,60,324,316]];
const VIEWS={all:[-8,-8,340,332],living:[52,52,280,156],bed:[170,192,162,132]};
const segRect=(s,t)=>[Math.min(s[0],s[2])-t/2,Math.min(s[1],s[3])-t/2,Math.max(s[0],s[2])+t/2,Math.max(s[1],s[3])+t/2];
const BLOCK=[...WALLS.map(s=>({r:segRect(s,4),n:'a wall'})),...THIN.map(s=>({r:segRect(s,1.5),n:'the closet'})),...FIX];

/* ---------- Catalog. w = width, d = depth (head/back is the top edge before rotating). ---------- */
const CAT={
  twin:{n:'Twin bed',t:'Twin',k:'bed',w:38,d:75,c:'Beds',f:'bed'}, full:{n:'Full bed',t:'Full',k:'bed',w:54,d:75,c:'Beds',f:'bed'},
  queen:{n:'Queen bed',t:'Queen',k:'bed',w:60,d:80,c:'Beds',f:'bed'}, king:{n:'King bed',t:'King',k:'bed',w:76,d:80,c:'Beds',f:'bed'},
  calking:{n:'Cal king bed',t:'Cal king',k:'bed',w:72,d:84,c:'Beds',f:'bed'},
  nightstand:{n:'Nightstand',t:'',k:'wood',w:18,d:16,c:'Beds'},
  sectional:{n:'Sectional sofa',t:'Sofa',k:'sofa',w:91,d:38,c:'Seating'}, chaise:{n:'Sectional chaise',t:'Chaise',k:'sofa',w:38,d:51,c:'Seating'},
  sofa:{n:'Straight sofa',t:'Sofa',k:'sofa',w:84,d:36,c:'Seating'}, loveseat:{n:'Loveseat',t:'Loveseat',k:'sofa',w:60,d:36,c:'Seating'},
  armchair:{n:'Armchair',t:'',k:'sofa',w:32,d:32,c:'Seating'}, chair:{n:'Chair',t:'',k:'wood',w:18,d:18,c:'Seating'},
  ottoman:{n:'Ottoman',t:'',k:'sofa0',w:24,d:24,c:'Seating'},
  dining:{n:'Dining table',t:'Dining',k:'wood',w:48,d:24,c:'Tables'}, dining6:{n:'Dining table for 6',t:'Dining',k:'wood',w:72,d:36,c:'Tables'},
  round:{n:'Round table',t:'Table',k:'round',w:42,d:42,c:'Tables'}, desk:{n:'Desk',t:'Desk',k:'desk',w:60,d:28,c:'Tables'},
  coffee:{n:'Coffee table',t:'Coffee',k:'wood',w:44,d:22,c:'Tables'},
  dresser:{n:'Dresser',t:'Dresser',k:'wood',w:48,d:16,c:'Storage'}, bookshelf:{n:'Bookshelf',t:'Shelf',k:'wood',w:36,d:12,c:'Storage'},
  wardrobe:{n:'Wardrobe',t:'Wardrobe',k:'wood',w:40,d:22,c:'Storage'},
  tv55:{n:'55″ TV',t:'55″',k:'tv',w:49,d:16,c:'Media & decor',f:'tv'}, tv65:{n:'65″ TV',t:'65″',k:'tv',w:57,d:16,c:'Media & decor',f:'tv'},
  tv75:{n:'75″ TV',t:'75″',k:'tv',w:66,d:16,c:'Media & decor',f:'tv'}, tv85:{n:'85″ TV',t:'85″',k:'tv',w:75,d:16,c:'Media & decor',f:'tv'},
  rug:{n:'Rug 5×8',t:'Rug',k:'rug',w:96,d:60,c:'Media & decor'}, plant:{n:'Plant',t:'',k:'plant',w:16,d:16,c:'Media & decor'},
  custom:{n:'Custom piece',t:'Custom',k:'wood',w:36,d:24}
};
const P=(type,x,y,rot=0,o={})=>({type,x,y,rot,...o});
const BEDROOM_Q=[P('queen',245,281,270),P('nightstand',214,242),P('dresser',312,281,90)];
const PRESETS={
  wall:{name:'Along the wall',items:[P('desk',158,77,0,{w:96,d:26}),P('chair',158,101),P('dining',174,133),P('chair',183,111),P('chair',166,155),
    P('tv65',270,71),P('sectional',274.5,177,180),P('chaise',301,132.5,180),...BEDROOM_Q]},
  split:{name:'Split the room',items:[P('tv65',313,121,90),P('sectional',215,121,270),P('chaise',259.5,94.5,270),P('desk',150,77,0,{w:72,d:26}),
    P('chair',150,101),P('dining',140,165),P('chair',140,143),P('chair',140,187),...BEDROOM_Q]},
  king:{name:'King suite',items:[P('tv65',270,189,180),P('sectional',274.5,81,0),P('chaise',301,125.5,0),P('desk',160,77,0,{w:96,d:26}),
    P('chair',160,101),P('dining',140,165),P('chair',140,143),P('chair',140,187),P('king',282,274,90)]}
};

/* ---------- State ---------- */
const $=s=>document.querySelector(s), svg=$('#plan'), dock=$('#dock'), scrim=$('#scrim');
const store={get(k,f){try{const v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let uid=1, items=[], sel=null, layout='wall', edited=false, undo=[], redo=[];
let saved=store.get('fp.saved',[]), snapOn=true, gridOn=true, want=VIEWS.all.slice(), vb=[0,0,1,1];
const clone=a=>JSON.parse(JSON.stringify(a));
const fresh=list=>clone(list).map(i=>({...i,id:uid++}));
const def=it=>CAT[it.type]||CAT.custom, W=it=>it.w??def(it).w, D=it=>it.d??def(it).d;
const nameOf=it=>it.name||def(it).n;
const box=it=>{const s=it.rot%180!==0,hw=(s?D(it):W(it))/2,hh=(s?W(it):D(it))/2;return[it.x-hw,it.y-hh,it.x+hw,it.y+hh]};
const hit=(a,b,e=.5)=>a[0]<b[2]-e&&a[2]>b[0]+e&&a[1]<b[3]-e&&a[3]>b[1]+e;
const inside=(x,y)=>ROOMS.some(r=>x>=r[0]-.5&&x<=r[2]+.5&&y>=r[1]-.5&&y<=r[3]+.5);
const solid=it=>def(it).k!=='rug';

function check(it){
  const a=box(it);
  if(![[a[0],a[1]],[a[2],a[1]],[a[0],a[3]],[a[2],a[3]],[it.x,it.y]].every(p=>inside(p[0],p[1])))return{s:'bad',m:'Outside the apartment'};
  if(!solid(it))return{s:'ok',m:'Rugs sit under everything'};
  const b=BLOCK.find(o=>hit(a,o.r)); if(b)return{s:'bad',m:'Overlaps '+b.n};
  const o=items.find(q=>q!==it&&solid(q)&&hit(a,box(q))); if(o)return{s:'bad',m:'Overlaps the '+nameOf(o).toLowerCase()};
  const d=DOORS.find(q=>hit(a,q.r)); if(d)return{s:'warn',m:'Blocks '+d.n};
  let g=Infinity;
  for(const r of [...BLOCK.map(q=>q.r),...items.filter(q=>q!==it&&solid(q)).map(box)]){
    if(r[1]<a[3]-.5&&r[3]>a[1]+.5){if(r[2]<=a[0]+.5)g=Math.min(g,Math.max(0,a[0]-r[2]));if(r[0]>=a[2]-.5)g=Math.min(g,Math.max(0,r[0]-a[2]))}
    if(r[0]<a[2]-.5&&r[2]>a[0]+.5){if(r[3]<=a[1]+.5)g=Math.min(g,Math.max(0,a[1]-r[3]));if(r[1]>=a[3]-.5)g=Math.min(g,Math.max(0,r[1]-a[3]))}
  }
  let tight=Infinity; // smallest gap that is not simply "touching"
  for(const r of [...BLOCK.map(q=>q.r),...items.filter(q=>q!==it&&solid(q)).map(box)]){
    const gs=[];
    if(r[1]<a[3]-.5&&r[3]>a[1]+.5)gs.push(a[0]-r[2],r[0]-a[2]);
    if(r[0]<a[2]-.5&&r[2]>a[0]+.5)gs.push(a[1]-r[3],r[1]-a[3]);
    for(const v of gs)if(v>=1&&v<tight)tight=v;
  }
  return{s:'ok',m:tight<36?`Fits. Tightest gap ${Math.round(tight)}″`:'Fits with room to walk'};
}

/* ---------- Drawing ---------- */
const INK='#1d1a18';
function shape(it){
  const k=def(it).k,w=W(it),d=D(it),x=-w/2,y=-d/2;
  const R=(X,Y,Wd,H,f,rx=1.5,ex='')=>`<rect x="${X}" y="${Y}" width="${Wd}" height="${H}" rx="${rx}" fill="${f}" ${ex}/>`;
  const st=`stroke="${INK}" stroke-width=".8"`;
  if(k==='bed'){const n=w<50?1:2,pw=(w-8-(n-1)*4)/n;let s=R(x,y,w,d,'#ebe3d6',2,st)+R(x,y,w,3.5,'#b9a58c',1,st);
    for(let i=0;i<n;i++)s+=R(x+4+i*(pw+4),y+6,pw,13,'#fbf8f2',3,st);
    return s+`<path d="M${x} ${y+25}H${x+w}" ${st} fill="none"/>`}
  if(k==='sofa'||k==='sofa0'){let s=R(x,y,w,d,'#2f4a3f',3,st);if(k==='sofa0')return s;s+=R(x,y,w,7,'#263d34',3);
    const n=Math.max(1,Math.round(w/30));for(let i=1;i<n;i++)s+=`<path d="M${x+i*w/n} ${y+9}V${y+d-3}" stroke="#263d34" stroke-width="1" fill="none"/>`;return s}
  if(k==='tv')return R(x,y,w,d,'#d8c3ad',1.5,st)+R(x+1.5,y+1.5,w-3,4,INK,1);
  if(k==='desk')return R(x,y,w,d,'#a9735a',1.5,st)+R(x+w*.18,y+2.5,w*.64,3,INK,1);
  if(k==='round')return`<circle r="${w/2}" fill="#8f4f2f" ${st}/>`;
  if(k==='plant')return`<circle r="${w/2}" fill="#4d7a5c" ${st}/><circle r="${w/4}" fill="#2f4a3f"/>`;
  if(k==='rug')return R(x,y,w,d,'#c9b79c',2,`stroke="#9a8667" stroke-width=".8" opacity=".75"`)+R(x+4,y+4,w-8,d-8,'none',1,`stroke="#9a8667" stroke-width=".8" stroke-dasharray="3 3"`);
  return R(x,y,w,d,'#8f4f2f',1.5,st);
}
function label(it){
  const t=it.name?it.name:def(it).t;if(!t)return'';
  const a=box(it),bw=a[2]-a[0],bh=a[3]-a[1],est=t.length*3.1+2,k=def(it).k;
  let r;if(est<=bw)r=-it.rot;else if(est<=bh)r=-it.rot-90;else return'';
  const light=k==='bed'||k==='tv'||k==='rug';
  const dy=k==='tv'&&r===-it.rot&&it.rot===0?3.5:(k==='bed'?0:0);
  return`<text transform="rotate(${r})" y="${dy}" text-anchor="middle" dominant-baseline="central" font-size="5.2" font-weight="500" fill="${light?INK:'#f4f0e7'}" pointer-events="none">${esc(t)}</text>`;
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function staticPlan(){
  const L=(s,w,c=INK)=>`<path d="M${s[0]} ${s[1]}L${s[2]} ${s[3]}" stroke="${c}" stroke-width="${w}" stroke-linecap="square" fill="none"/>`;
  const fr=(r,f,ex='')=>`<rect x="${r[0]}" y="${r[1]}" width="${r[2]-r[0]}" height="${r[3]-r[1]}" fill="${f}" ${ex}/>`;
  const fx=`stroke="${INK}" stroke-width=".8"`;
  const txt=(t,x,y,s=7,ls=5)=>`<text x="${x}" y="${y}" font-family="Lora,Georgia,serif" font-size="${s}" letter-spacing="${ls}" fill="#8d8478" text-anchor="middle" pointer-events="none">${t}</text>`;
  let s=`<defs><pattern id="g" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M12 0H0V12" fill="none" stroke="#d9d1c2" stroke-width=".4"/></pattern></defs>`;
  s+=fr([0,0,106,137],'#f4f0e7')+fr([59,60,324,316],'#f4f0e7');
  s+=fr([26,26,104,135],'#e6d9c6')+fr([61,246,175,314],'#d5e0da')+fr([61,201,96,242],'#e6d9c6')+fr([141,201,175,242],'#e6d9c6')
    +fr([179,201,322,314],'#ebe4d8')+fr([218,201,322,231],'#e6d9c6');
  s+=`<g id="gridl">${fr([0,0,106,137],'url(#g)')+fr([59,60,324,316],'url(#g)')}</g>`;
  s+=txt('Kitchen',68,84,9,6)+txt('Entry',96,166,6)+txt('Living',120,188,6)+txt('Bath',128,272,6)+txt('Bedroom',262,246,8,6)+txt('Closet',268,219,5)+txt('Closet',158,224,4,2);
  // fixtures
  s+=fr(FIX[0].r,'#f8f5ee',fx)+fr([50,7,74,23],'#f8f5ee',fx)+`<ellipse cx="62" cy="15" rx="7" ry="4.5" fill="#f8f5ee" ${fx}/>`+fr([78,7,98,23],'#f8f5ee',fx)+`<circle cx="88" cy="15" r="3.5" fill="#f8f5ee" ${fx}/>`;
  s+=fr(FIX[1].r,'#f8f5ee',fx)+fr([5,52,25,80],'#f8f5ee',fx)+[[10,59],[20,59],[10,72],[20,72]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#f8f5ee" ${fx}/>`).join('');
  s+=fr(FIX[2].r,'#f8f5ee',fx)+`<path d="M12 96V134" ${fx} fill="none"/>`;
  s+=fr(FIX[3].r,'#f8f5ee',fx)+`<circle cx="79" cy="224" r="5" fill="#f8f5ee" ${fx}/><text x="79" y="215" font-size="4" text-anchor="middle" fill="${INK}">W/D</text>`;
  s+=`<rect x="62" y="250" width="30" height="62" rx="6" fill="#f8f5ee" ${fx}/><ellipse cx="77" cy="281" rx="8" ry="13" fill="#f8f5ee" ${fx}/>`;
  s+=`<rect x="109" y="286" width="12" height="8" rx="2" fill="#f8f5ee" ${fx}/><ellipse cx="115" cy="299" rx="5.5" ry="7" fill="#f8f5ee" ${fx}/>`;
  s+=fr(FIX[6].r,'#f8f5ee',fx)+`<circle cx="153" cy="301" r="2.5" fill="#f8f5ee" ${fx}/>`;
  // doors
  const dr=`fill="none" stroke="#6f675d" stroke-width=".7"`;
  s+=`<path d="M59 147H95A36 36 0 0 1 59 183" ${dr}/><path d="M216 199V167A32 32 0 0 0 184 199" ${dr}/>`
    +`<path d="M102 244V274A30 30 0 0 0 132 244" ${dr}/><path d="M177 251H145A32 32 0 0 0 177 283" ${dr}/>`;
  s+=THIN.map(t=>L(t,1.5,'#4a433d')).join('')+WALLS.map(w=>L(w,4)).join('');
  return s;
}
function render(){
  if(!svg.firstChild)svg.innerHTML=`<g id="base">${staticPlan()}</g><g id="its"></g>`;
  svg.querySelector('#gridl').style.display=gridOn?'':'none';
  const order=[...items].sort((a,b)=>(solid(a)?1:0)-(solid(b)?1:0)||(a.id===sel)-(b.id===sel));
  let h='';
  for(const it of order){
    const c=check(it),w=W(it),d=D(it),on=it.id===sel;
    const col=c.s==='bad'?'#d8492f':c.s==='warn'?'#d99a1c':'#b9953f';
    let o='';
    if(c.s!=='ok')o+=`<rect x="${-w/2}" y="${-d/2}" width="${w}" height="${d}" rx="2" fill="${col}" fill-opacity=".28" stroke="${col}" stroke-width="1.6"/>`;
    if(on)o+=`<rect x="${-w/2-2}" y="${-d/2-2}" width="${w+4}" height="${d+4}" rx="3" fill="none" stroke="${c.s==='ok'?'#1d1a18':col}" stroke-width="1.4" stroke-dasharray="4 3"/>`;
    h+=`<g data-id="${it.id}" transform="translate(${it.x} ${it.y}) rotate(${it.rot})" style="cursor:grab">${shape(it)}${o}${label(it)}</g>`;
  }
  svg.querySelector('#its').innerHTML=h;
  renderDock();
}
const ICON={rot:'<svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>',
  dup:'<svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>',
  del:'<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>'};
function renderDock(){
  const it=items.find(i=>i.id===sel);
  $('#sub').textContent=(layout&&PRESETS[layout]?PRESETS[layout].name:layout||'Custom')+(edited?' · edited':'');
  $('#undo').disabled=!undo.length;$('#redo').disabled=!redo.length;
  if(!it){
    const bad=items.filter(i=>check(i).s==='bad').length,warn=items.filter(i=>check(i).s==='warn').length;
    const cls=bad?'bad':warn?'warn':'',msg=bad?`${bad} piece${bad>1?'s':''} overlap or don’t fit`:warn?`${warn} piece${warn>1?'s':''} block a door`:'Everything fits';
    dock.innerHTML=`<div class="stat"><i class="dot ${cls}"></i>${items.length} pieces · ${msg}. Tap a piece to edit it.</div>
      <div class="row"><button class="primary" data-a="add">+ Add furniture</button></div>`;return;
  }
  const c=check(it),f=def(it).f;
  const sizes=f?`<div class="sizes">${Object.entries(CAT).filter(([,v])=>v.f===f).map(([k,v])=>`<button class="chip" data-size="${k}" aria-pressed="${k===it.type}">${v.t} <span style="opacity:.7">${v.w}×${v.d}</span></button>`).join('')}</div>`:'';
  dock.innerHTML=`<div class="row"><div class="info"><b>${esc(nameOf(it))}</b><span>${W(it)}″ wide × ${D(it)}″ deep</span></div><button class="chip" data-a="done">Done</button></div>
    <div class="stat"><i class="dot ${c.s==='ok'?'':c.s}"></i>${c.m}</div>${sizes}
    <div class="row"><button class="act" data-a="rot">${ICON.rot}Rotate</button><button class="act" data-a="dup">${ICON.dup}Duplicate</button><button class="act del" data-a="del" aria-label="Delete">${ICON.del}</button></div>`;
}
function renderLayouts(){
  $('#layouts').innerHTML=Object.entries(PRESETS).map(([k,p])=>`<button class="chip" data-p="${k}" aria-pressed="${layout===k}">${p.name}</button>`).join('')
    +saved.map((s,i)=>`<button class="chip" data-s="${i}" aria-pressed="${layout===s.name}">${esc(s.name)}</button>`).join('')
    +`<button class="chip save" data-a="save">+ Save</button>`;
}

/* ---------- Edits and history ---------- */
function commit(mark=true){undo.push(prev);if(undo.length>80)undo.shift();redo=[];if(mark)edited=true;snapshot()}
let prev='[]';
function snapshot(){prev=JSON.stringify(items);store.set('fp.cur',{items,layout,edited})}
function restore(json){items=JSON.parse(json);if(!items.some(i=>i.id===sel))sel=null;edited=true;snapshot();render()}
function load(key,list,name){undo.push(prev);redo=[];items=fresh(list);sel=null;layout=name||key;edited=false;snapshot();renderLayouts();render()}
function freeSpot(it,cx=vb[0]+vb[2]/2,cy=vb[1]+vb[3]/2,step=3,max=240){
  cx=Math.round(cx);cy=Math.round(cy);
  for(let r=0;r<=max;r+=step)for(let i=-r;i<=r;i+=step)for(const[dx,dy]of r?[[i,-r],[i,r],[-r,i],[r,i]]:[[0,0]]){
    it.x=cx+dx;it.y=cy+dy;if(check(it).s==='ok')return true;
  }
  it.x=cx;it.y=cy;return false;
}
function add(type,o={}){
  const it={id:uid++,type,x:0,y:0,rot:0,...o};
  // try both orientations so big pieces (a king bed) land somewhere they actually fit
  if(!freeSpot(it)){it.rot=90;if(!freeSpot(it)){it.rot=0;freeSpot(it)}}
  items.push(it);sel=it.id;commit();closeSheet();render();
}
function snap(it){
  it.x=Math.round(it.x*2)/2;it.y=Math.round(it.y*2)/2;if(!snapOn)return;
  const a=box(it),xs=[],ys=[];
  for(const r of [...BLOCK.map(q=>q.r),...items.filter(q=>q!==it&&solid(q)).map(box)]){xs.push(r[0],r[2]);ys.push(r[1],r[3])}
  let dx=9,dy=9;
  for(const l of xs)for(const e of[a[0],a[2]]){const v=l-e;if(Math.abs(v)<Math.abs(dx)&&Math.abs(v)<=3)dx=v}
  for(const l of ys)for(const e of[a[1],a[3]]){const v=l-e;if(Math.abs(v)<Math.abs(dy)&&Math.abs(v)<=3)dy=v}
  if(dx!==9)it.x+=dx;if(dy!==9)it.y+=dy;
}

/* ---------- View, pan, pinch, drag ---------- */
function applyView(){
  const r=svg.getBoundingClientRect();if(!r.width||!r.height)return;
  let[x,y,w,h]=want;const ar=r.width/r.height;
  if(w/h<ar){const nw=h*ar;x-=(nw-w)/2;w=nw}else{const nh=w/ar;y-=(nh-h)/2;h=nh}
  vb=[x,y,w,h];svg.setAttribute('viewBox',vb.join(' '));
}
const world=e=>{const r=svg.getBoundingClientRect(),s=vb[2]/r.width;return[vb[0]+(e.clientX-r.left)*s,vb[1]+(e.clientY-r.top)*s]};
const pts=new Map();let drag=null,pan=null,pinch=null,down=null;
svg.addEventListener('pointerdown',e=>{
  svg.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2){
    if(drag){drag.it.x=drag.ox;drag.it.y=drag.oy;drag=null;render()}pan=null;
    const[p,q]=[...pts.values()],r=svg.getBoundingClientRect();
    pinch={d:Math.hypot(p.x-q.x,p.y-q.y)||1,w:vb[2],h:vb[3],m:[vb[0]+((p.x+q.x)/2-r.left)*vb[2]/r.width,vb[1]+((p.y+q.y)/2-r.top)*vb[2]/r.width]};return;
  }
  down={x:e.clientX,y:e.clientY,moved:false};
  const g=e.target.closest('[data-id]');
  if(g){const it=items.find(i=>i.id===+g.dataset.id);if(sel!==it.id){sel=it.id;render()}drag={it,ox:it.x,oy:it.y,w:world(e)}}
  else pan={x:e.clientX,y:e.clientY,v:vb.slice()};
});
svg.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const r=svg.getBoundingClientRect();
  if(pinch&&pts.size>=2){
    const[p,q]=[...pts.values()],k=pinch.d/(Math.hypot(p.x-q.x,p.y-q.y)||1);
    const w=Math.min(900,Math.max(70,pinch.w*k)),h=w*r.height/r.width,s=w/r.width;
    want=[pinch.m[0]-((p.x+q.x)/2-r.left)*s,pinch.m[1]-((p.y+q.y)/2-r.top)*s,w,h];applyView();markView();return;
  }
  if(down&&Math.hypot(e.clientX-down.x,e.clientY-down.y)>5)down.moved=true;
  if(drag&&down.moved){const w=world(e);drag.it.x=drag.ox+w[0]-drag.w[0];drag.it.y=drag.oy+w[1]-drag.w[1];snap(drag.it);render()}
  else if(pan&&down.moved){const s=vb[2]/r.width;want=[pan.v[0]-(e.clientX-pan.x)*s,pan.v[1]-(e.clientY-pan.y)*s,pan.v[2],pan.v[3]];applyView();markView()}
});
const up=e=>{
  if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);
  if(pinch){if(pts.size<2)pinch=null;drag=pan=down=null;return}
  if(drag&&(drag.it.x!==drag.ox||drag.it.y!==drag.oy))commit();
  else if(pan&&down&&!down.moved&&sel!==null){sel=null;render()}
  drag=pan=down=null;
};
svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
svg.addEventListener('wheel',e=>{e.preventDefault();const m=world(e),k=e.deltaY>0?1.12:.89,w=Math.min(900,Math.max(70,vb[2]*k)),f=w/vb[2];
  want=[m[0]-(m[0]-vb[0])*f,m[1]-(m[1]-vb[1])*f,w,vb[3]*f];applyView();markView()},{passive:false});
function markView(v){document.querySelectorAll('#views .fb').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===v))}
new ResizeObserver(applyView).observe(svg);

/* ---------- Buttons ---------- */
$('#views').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(!b)return;want=VIEWS[b.dataset.view].slice();applyView();markView(b.dataset.view)});
$('#snap').onclick=e=>{snapOn=!snapOn;e.currentTarget.setAttribute('aria-pressed',snapOn)};
$('#grid').onclick=e=>{gridOn=!gridOn;e.currentTarget.setAttribute('aria-pressed',gridOn);render()};
$('#undo').onclick=()=>{if(!undo.length)return;redo.push(prev);restore(undo.pop())};
$('#redo').onclick=()=>{if(!redo.length)return;undo.push(prev);restore(redo.pop())};
$('#reset').onclick=()=>{const s=saved.find(q=>q.name===layout);if(PRESETS[layout])load(layout,PRESETS[layout].items);else if(s)load(null,s.items,s.name);else load('wall',PRESETS.wall.items)};
$('#layouts').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.p)load(b.dataset.p,PRESETS[b.dataset.p].items);
  else if(b.dataset.s){const s=saved[+b.dataset.s];load(null,s.items,s.name)}
  else openSave()});
dock.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const it=items.find(i=>i.id===sel),a=b.dataset.a;
  if(a==='add')return openAdd();
  if(a==='done'){sel=null;return render()}
  if(!it)return;
  if(b.dataset.size){if(b.dataset.size===it.type)return;it.type=b.dataset.size;delete it.w;delete it.d;
    if(check(it).s==='bad'){const x=it.x,y=it.y;if(!freeSpot(it,x,y,1,40)){it.x=x;it.y=y}}}
  else if(a==='rot')it.rot=(it.rot+90)%360;
  else if(a==='dup'){const c={...it,id:uid++};freeSpot(c,it.x,it.y);items.push(c);sel=c.id}
  else if(a==='del'){items=items.filter(i=>i!==it);sel=null}
  commit();render()});
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;const it=items.find(i=>i.id===sel);if(!it)return;
  const m={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];
  if(m){it.x+=m[0];it.y+=m[1]}else if(e.key==='r')it.rot=(it.rot+90)%360;else if(e.key==='Delete'||e.key==='Backspace'){items=items.filter(i=>i!==it);sel=null}else return;
  e.preventDefault();commit();render()});

/* ---------- Sheets ---------- */
function closeSheet(){scrim.hidden=true;scrim.innerHTML=''}
scrim.addEventListener('click',e=>{if(e.target===scrim||e.target.closest('[data-close]'))closeSheet()});
const sheet=(title,body)=>{scrim.innerHTML=`<div class="sheet" role="dialog" aria-label="${title}"><header class="gut"><h2>${title}</h2><button class="chip" data-close>Close</button></header><div class="body gut">${body}</div></div>`;scrim.hidden=false};
function openAdd(){
  const cats=[...new Set(Object.values(CAT).map(c=>c.c).filter(Boolean))];
  sheet('Add furniture',cats.map(c=>`<div class="cat">${c}</div><div class="grid">${Object.entries(CAT).filter(([,v])=>v.c===c).map(([k,v])=>
    `<button class="card" data-add="${k}"><svg viewBox="-52 -46 104 92">${shape({type:k})}</svg><b>${v.n}</b><span>${v.w} × ${v.d}″</span></button>`).join('')}</div>`).join('')
   +`<div class="cat">Custom size</div><form class="custom" id="cf"><label>Name<input id="c-name" maxlength="18" placeholder="Bench"></label>
     <label>Width (in)<input id="c-w" type="number" inputmode="decimal" min="4" max="200" value="36"></label>
     <label>Depth (in)<input id="c-d" type="number" inputmode="decimal" min="4" max="200" value="24"></label>
     <button class="act">Add custom piece</button></form>
     <p class="note">New pieces land in the nearest free spot in view. Previews are drawn to the same scale.</p>`);
  scrim.querySelector('.body').addEventListener('click',e=>{const b=e.target.closest('[data-add]');if(b)add(b.dataset.add)});
  $('#cf').addEventListener('submit',e=>{e.preventDefault();const w=+$('#c-w').value,d=+$('#c-d').value;if(!(w>=4&&w<=200&&d>=4&&d<=200))return;
    add('custom',{w,d,name:$('#c-name').value.trim()||'Custom piece'})});
}
function openSave(){
  sheet('Saved layouts',`<form class="custom" id="sf"><label>Name this layout<input id="s-name" maxlength="24" value="${esc(PRESETS[layout]?'My layout '+(saved.length+1):layout||'My layout')}"></label><button class="act">Save current layout</button></form>
    <div style="margin-top:14px">${saved.map((s,i)=>`<div class="saved"><b>${esc(s.name)}</b><button class="chip" data-load="${i}">Open</button><button class="chip" data-rm="${i}">Delete</button></div>`).join('')||'<p class="note">Nothing saved yet. Saved layouts stay on this device.</p>'}</div>`);
  $('#sf').addEventListener('submit',e=>{e.preventDefault();const n=$('#s-name').value.trim();if(!n||PRESETS[n])return;
    const rec={name:n,items:items.map(({id,...r})=>r)},i=saved.findIndex(s=>s.name===n);if(i>=0)saved[i]=rec;else saved.push(rec);
    store.set('fp.saved',saved);layout=n;edited=false;snapshot();renderLayouts();render();closeSheet()});
  scrim.querySelector('.body').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.load){const s=saved[+b.dataset.load];load(null,s.items,s.name);closeSheet()}
    else if(b.dataset.rm){saved.splice(+b.dataset.rm,1);store.set('fp.saved',saved);renderLayouts();openSave()}});
}

/* ---------- Boot ---------- */
(function(){
  const cur=store.get('fp.cur',null);
  if(cur&&Array.isArray(cur.items)&&cur.items.length){items=fresh(cur.items);layout=cur.layout||'wall';edited=!!cur.edited}
  else items=fresh(PRESETS.wall.items);
  prev=JSON.stringify(items);applyView();markView('all');renderLayouts();render();
})();
</script>
